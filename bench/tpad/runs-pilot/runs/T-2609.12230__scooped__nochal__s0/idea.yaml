  problem: Current language-model training for knowledge graph-based question answering
    uses isolated head-relation-tail triples, depriving the model of the surrounding
    context that supports multi-step inference.
  target_domain: Multi-hop question answering over knowledge graphs using language
    models
  proposed_method: 'Enrich each target triple (or path) with additional triples drawn
    from the same source passage, forming a local context subgraph that is presented
    together with the primary supervision signal. Fine-tune the language model under
    two regimes: (A) using only the target triple/path, and (B) using the target triple/path
    plus the local context subgraph. Introduce an adaptive repair loop that detects
    one-hop failures, generates corrective examples, and iteratively refines the model.
    After this cleaning stage, apply reinforcement-learning-based optimization on
    lower-hop QA instances and evaluate transfer to deeper multi-hop queries.'
  hypothesis: Enriching training with local context subgraphs and applying an adaptive
    repair loop will improve hit@1 accuracy on multi-hop KGQA, especially for higher-hop
    questions, by providing better factual grounding and contextual reasoning, and
    the adaptive repair loop will improve the reliability of base facts.
  research_question: Does enriching training triples with local context subgraphs
    and applying an adaptive repair loop improve hit@1 accuracy on multi-hop KGQA
    (MetaQA) for 2-hop and 3-hop questions compared to training on isolated triples?
  expected_contribution: A training method that improves multi-hop KGQA performance
    by leveraging local context and adaptive repair, with analysis of transfer from
    lower-hop to higher-hop, and a demonstration of improved base fact reliability
    through the repair loop.
  assumptions:
  - The local context subgraph from the same passage is supportive and not noisy.
  - The adaptive repair loop can generate effective corrective examples for one-hop
    failures.
  - Reinforcement learning optimization on lower-hop QA transfers to higher-hop QA.
  - The base language model and KGQA architecture (e.g., EmbedKGQA or Rce-KGQA) are
    suitable for the proposed enrichment.
  variables:
    independent:
    - 'Training condition: isolated triples (baseline)'
    - 'Training condition: enriched with local context subgraph'
    - 'Training condition: enriched + adaptive repair loop'
    - 'Training condition: enriched + adaptive repair loop + RL optimization'
    dependent:
    - hit@1 accuracy on MetaQA 1-hop
    - hit@1 accuracy on MetaQA 2-hop
    - hit@1 accuracy on MetaQA 3-hop
    controls:
    - Model architecture (EmbedKGQA or Rce-KGQA)
    - Base knowledge graph (MetaQA KG)
    - Evaluation datasets (MetaQA)
    - Hyperparameters (learning rate, batch size, etc.)
    - Random seeds
  target_system: Language model-based knowledge graph question answering system (e.g.,
    EmbedKGQA or Rce-KGQA)
  expected_benefits:
  - Improved hit@1 accuracy on multi-hop QA
  - Better factual grounding
  - Reduced error propagation in multi-hop reasoning
  potential_risks:
  - The local context subgraph may introduce noise
  - The adaptive repair loop may not converge or may overfit
  - RL optimization may be unstable or fail to transfer
  ambiguities:
  - question: What evaluation metric to use?
    resolution: hit@1 accuracy (based on arxiv:2110.12679 and doi:10.18653/v1/2020.acl-main.412)
    resolved_by: literature
  - question: Which dataset to use for evaluation?
    resolution: MetaQA (based on both papers)
    resolved_by: literature
  - question: Which model architecture to use as base?
    resolution: EmbedKGQA or Rce-KGQA (based on doi:10.18653/v1/2020.acl-main.412
      and arxiv:2110.12679)
    resolved_by: literature
  - question: Which baselines to compare with?
    resolution: EmbedKGQA and Rce-KGQA (based on the same papers)
    resolved_by: literature
  - question: What constitutes the 'same source passage' for local context?
    resolution: Assumed to be the text passage from which the triple was extracted
      if the KG is built from text
    resolved_by: assumption
