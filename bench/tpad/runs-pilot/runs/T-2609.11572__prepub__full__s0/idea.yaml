  raw_idea: 'The reliability of open‑domain question answering drops sharply when
    source texts are continuously amended, as in statutes, policies, or regulations.
    In such settings each new amendment supersedes earlier clauses while retaining
    much of the original wording, creating a dense semantic overlap across successive
