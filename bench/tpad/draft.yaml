- id: T-2609.08267
  idea: 'Large language models often generate statements that are factually inaccurate, and current detection techniques rely
    mainly on internal signals such as confidence scores or self‑consistency, which can be outdated or incomplete for specialized
    or recent topics. We propose to enhance hallucination detection by grounding generation in external documents retrieved
    at inference time. Specifically, the plan is to extract every named entity from the model’s output and compare it with
    entities found in the retrieved passages, evaluating alignment along three complementary dimensions: lexical presence,
    contextual fit, and relational consistency. To ensure robustness, we will also perform a counterfactual stability test
    by perturbing the retrieved evidence and observing whether the entity‑evidence alignment persists. This approach aims
