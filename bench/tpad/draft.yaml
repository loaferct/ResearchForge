- id: T-2609.11393
  idea: 'Large language models often produce confident but incorrect reasoning chains, and existing inference‑time tuning
    methods rely solely on confidence scores, which can be misleading. We propose to improve reasoning by jointly optimizing
    for high confidence and for robustness of that confidence to small, local changes in the input prompt. The approach keeps
    the base model fixed and learns a lightweight task‑specific prefix; during optimization the prefix is adjusted to increase
    the model’s confidence while simultaneously minimizing the variation of that confidence under two perturbation regimes:
    (1) random nearby modifications of the prefix to encourage distributional smoothness, and (2) worst‑case, adversarial
    tweaks to bound sensitivity. By enforcing this stability constraint we aim to steer the model toward reasoning trajectories
    that are both confident and reliable, and we will evaluate the method on a suite of reasoning benchmarks.'
  realising:
    title: 'Beyond Confidence: Stability-Aware Test-Time Adaptation for LLM Reasoning'
    arxiv: '2609.11393'
    published: '2026-09-10'
  prior_work:
  - title: 'Steer2Adapt: Dynamically Composing Steering Vectors Elicits Efficient Adaptation of LLMs'
    arxiv: '2602.07276'
    doi: 10.48550/arXiv.2602.07276
    published: '2026-02-07'
  - title: 'Seek in the Dark: Reasoning via Test-Time Instance-Level Policy Gradient in Latent Space'
    arxiv: '2505.13308'
    doi: 10.48550/arXiv.2505.13308
    published: '2025-05-19'
  - title: 'Model Whisper: Steering Vectors Unlock Large Language Models'' Potential in Test-time'
    arxiv: '2512.04748'
    doi: 10.48550/arXiv.2512.04748
    published: '2025-12-04'
  domain: cs
  verification: ''
  _audit:
    realising_abstract: 'Test-time adaptation has emerged as a lightweight alternative to costly post-training for improving
      the reasoning capabilities of Large Language Models (LLMs) on downstream tasks. Predictive entropy provides a model-derived
      signal for such adaptation, guiding models toward higher-confidence reasoning states without external verifiers or reward
      models. However, higher confidence does not necessarily imply correctness, as LLMs may remain highly confident along
      incorrect reasoning trajectories. We observe that high-confidence reasoning is more likely to be correct when confidence
      remains stable under local perturbations. Based on this observation, we propose Test-Time Adaptation via Stability-Aware
      Confidence Optimization (TASCO), a framework that incorporates local stability into confidence-based test-time adaptation
      while keeping the LLM frozen. TASCO operationalizes local stability by optimizing a lightweight task-level prefix under
      two alternative perturbation strategies: Random Perturbation promotes distributional stability across trajectories induced
      by nearby perturbed prefixes, whereas Sharpness-Aware Perturbation targets worst-case local sensitivity. Experiments
      demonstrate that TASCO improves reasoning accuracy and token efficiency across diverse LLMs and reasoning benchmarks,
      while behavioral analyses show that it maintains stable confidence under local perturbations without prematurely concentrating
      the model''s predictive distribution.'
    references_total: 37
    references_earlier_with_abstract: 24
