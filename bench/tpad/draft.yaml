    realising_abstract: Retrieval-augmented generation (RAG) critically depends on retrieving the evidence necessary for effective
      reasoning. However, this remains particularly challenging in multi-hop question answering (QA), where supporting passages
      are often linked through intermediate entities and relations that must be progressively uncovered. Existing retrieval
      approaches typically rely on a single retrieval intent or one-shot query expansion, limiting their ability to adapt
      to newly retrieved evidence and potentially introducing noisy or redundant retrieval signals. To address these limitations,
      we propose a training-free multi-hop retrieval framework that integrates evidence-conditioned exploration, passage-specific
      contrastive refinement, and coverage-aware final ranking. During offline indexing, the framework constructs passage-specific
      contrastive facets that characterize each passage relative to its semantically similar neighbors, providing fine-grained
      signals to distinguish closely related candidates. At inference time, the framework iteratively retrieves evidence,
      generates probes targeting unresolved information needs, refines candidate relevance using the contrastive facets, and
      selects a complementary set of passages that collectively cover diverse evidence-seeking intents. Experiments on MuSiQue,
      HotpotQA, and 2WikiMultihopQA demonstrate consistent improvements in retrieval quality and downstream QA performance
      over baselines.
