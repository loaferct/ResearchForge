- id: T-2609.10346
  idea: Multimodal language systems must handle hundreds of visual patches per image, leading to prohibitive inference costs.
    Existing methods reduce this burden by discarding patches according to a single, fixed criterion, implicitly assuming
    that one strategy works best for every picture. Preliminary analysis suggests that different pruning heuristics excel
    on different inputs, and that the average‑best method masks substantial per‑sample variation. We propose to train a lightweight
    selector that, given inexpensive visual and textual cues, predicts which pruning rule will be most effective for each
    individual image at a prescribed reduction level, while retaining the option to bypass pruning when it is likely detrimental.
    The selector will be a small plug‑in module that can be attached to any existing vision‑language model without altering
    its parameters.
