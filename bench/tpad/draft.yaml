- id: T-2609.08273
  idea: Long‑term interactive agents accumulate large amounts of episodic information, which soon makes storage and real‑time
    lookup prohibitively expensive. We propose a memory‑management framework that first groups past experiences into coherent
    segments by exploiting global semantic similarity together with local temporal continuity. Within each segment we construct
    a weighted spanning‑tree representation of the individual entries and iteratively collapse redundant nodes by merging
    along the strongest edges, thereby reducing the overall footprint while preserving the most informative connections. For
    retrieval, we plan to select a small set of anchor nodes and propagate relevance through their temporal neighborhoods,
    allowing the system to locate pertinent memories efficiently. This approach aims to retain the functional performance
    of the original memory while substantially lowering both memory size and query latency.
