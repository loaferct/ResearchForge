- id: T-2609.10441
  idea: 'Large language models are constrained by a fixed maximum number of tokens, which hampers their ability to reason
    over very long documents. Existing techniques that extend the effective context by processing the text sequentially and
    updating a small memory are slow and often require costly reinforcement‑learning fine‑tuning, leading to brittle performance
    on new data. We propose to reinterpret the reasoning task as a hierarchical filtering operation: the model will be prompted
    with the query and applied repeatedly to overlapping chunks of the source text, producing compact summaries that are then
    combined in a tree‑shaped aggregation. By allowing adjustable step sizes, inserting shortcut pathways to preserve salient
    evidence, and running several parallel query‑focused filters, the approach aims to reduce the reasoning depth from linear
    to logarithmic and to enable massive parallel execution without additional training.'
  realising:
    title: 'ConvMem: Convolutional Memory for Long-Context Reasoning'
    arxiv: '2609.10441'
    published: '2026-09-09'
  prior_work:
  - title: 'Memory-R1: Enhancing Large Language Model Agents to Manage and Utilize Memories via Reinforcement Learning'
    arxiv: '2508.19828'
    doi: 10.48550/arXiv.2508.19828
    published: '2025-08-27'
  - title: Ring Attention with Blockwise Transformers for Near-Infinite Context
    arxiv: '2310.01889'
    doi: 10.48550/arXiv.2310.01889
    published: '2023-10-03'
  - title: Efficient Memory Management for Large Language Model Serving with PagedAttention
    arxiv: '2309.06180'
    doi: 10.1145/3600006.3613165
    published: '2023-09-12'
  domain: cs
  verification: ''
  _audit:
    realising_abstract: While Large Language Models (LLMs) have demonstrated impressive capabilities, they often struggle
      with extremely long contexts due to fixed context limits. To address this, sequential approaches like MemAgent extend
      the effective context by reading text in segments and iteratively updating a fixed-size memory. However, this sequential
      paradigm suffers from high latency and requires costly reinforcement learning (RL) training, which can lead to overfitting
      on specific datasets. To overcome these limitations, we propose ConvMem, a training-free, highly parallelizable framework
      that reformulates long-context reasoning as a hierarchical convolution. Inspired by CNNs, ConvMem treats an LLM prompted
      with a specific query as a convolutional kernel. This kernel summarizes text segments hierarchically, shortening the
      reasoning path from a linear chain into a logarithmic tree. Specifically, ConvMem integrates \textit{Configurable Strides}
      and \textit{Skip Connections} to ensure robust evidence capture and propagation, while employing \textit{Multi-Kernel
      Convolution} to decompose complex queries into disentangled semantic channels. This design not only mitigates error
      accumulation but also enables massive parallelization across both text segments and reasoning threads. Experiments on
      RULER-HotpotQA and RULER-2WikiMultiHopQA demonstrate that ConvMem outperforms training-free baselines and avoids the
      risk of overfitting to parametric priors often observed in RL-trained models on out-of-distribution tasks.
