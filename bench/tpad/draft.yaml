- id: T-2609.07050
  idea: The challenge is to obtain all necessary supporting texts for questions that require several reasoning steps, where
    each step often introduces new entities or relations that must be discovered sequentially. Current retrieval pipelines
    typically issue a single query or perform a one‑time expansion, which cannot adapt to information uncovered during the
    search and may retrieve redundant or irrelevant passages. We propose a training‑free retrieval system that (1) pre‑computes
    for every passage a set of discriminative descriptors that highlight how it differs from its semantically close neighbors,
    (2) during inference iteratively issues targeted probes that address gaps revealed by previously retrieved passages, (3)
    refines the relevance scores of candidates using the pre‑computed descriptors, and (4) selects a diverse, complementary
    subset of passages that together satisfy the evolving information needs. This approach aims to improve evidence coverage
    and reduce noise in multi‑step question answering.
