- id: T-2609.11446
  idea: We aim to improve collaborative inference among a set of diverse models by establishing a unified reliability metric
    for their confidence scores. The plan is to first apply a model‑specific calibration step, using held‑out validation data,
    so that each model’s output probabilities reflect true likelihoods. Once calibrated, we will define common thresholds
    that determine whether a prediction can be accepted immediately, whether a more powerful model should be consulted, or
    whether multiple model outputs should be combined. By basing decisions on calibrated confidence, the routing policy becomes
    independent of the particular models or computational budget in use. We will also develop a theoretical link between calibration
    and the expected selective risk, and evaluate the approach on language and vision benchmarks.
  realising:
    title: Calibration-Aware Uncertainty Cascades for Efficient Heterogeneous Model Collaboration
    arxiv: '2609.11446'
    published: '2026-09-10'
  prior_work:
  - title: Optimising Calls to Large Language Models with Uncertainty-Based Two-Tier Selection
    arxiv: '2405.02134'
    doi: 10.48550/arXiv.2405.02134
    published: '2024-05-03'
  - title: Calibrating Language Models with Adaptive Temperature Scaling
    arxiv: '2409.19817'
    doi: 10.48550/arXiv.2409.19817
    published: '2024-09-29'
  - title: 'FrugalGPT: How to Use Large Language Models While Reducing Cost and Improving Performance'
    arxiv: '2305.05176'
    doi: 10.48550/arXiv.2305.05176
    published: '2023-05-09'
  domain: cs
  verification: ''
  _audit:
    realising_abstract: Heterogeneous model collaboration seeks to exploit the complementary strengths of different models
      to balance predictive performance and inference cost. Existing approaches typically rely either on trained routers,
      which tie routing decisions to a fixed task and model pool, or on raw-confidence cascades, whose thresholds lack consistent
      reliability semantics across heterogeneous models. Consequently, these approaches adapt poorly to changing model pools
      and deployment budgets. We propose Calibration-Aware Uncertainty Cascades (CAUC), a simple post-hoc framework that independently
      calibrates each model's confidence and selects deployment policies using validation data. The resulting calibrated confidence
      scores establish a common reliability scale for accepting an early prediction, invoking a stronger model, or selectively
      combining model outputs. This unified decision criterion decouples deployment policies from any particular model pool
      or operating budget. We further show theoretically that calibration gives confidence thresholds an explicit selective-risk
      interpretation, whereas uncalibrated scores offer no comparable reliability guarantee. Extensive experiments demonstrate
      that, across six language benchmarks, CAUC achieves an average relative accuracy improvement of 1.9% over strong-model-only
      inference while avoiding approximately 47% of strong-model calls. On image classification benchmarks, it maintains or
      improves predictive performance while reducing measured GFLOPs by up to 57%.
