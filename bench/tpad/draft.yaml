- id: T-2609.11192
  idea: Long‑range language models often rely on a separate compressor for each desired compression level, and the chosen
    level is applied uniformly to every input despite widely differing information needs. We propose to train a single compression
    model that is independent of any fixed budget by randomly sampling a memory‑budget size for each training instance. At
    inference time the appropriate budget would be selected per example either by a confidence‑driven cascade that progressively
    refines the compression until a quality threshold is met, or by a lightweight predictor that estimates the minimal budget
    required for the given input. This framework aims to provide flexible, per‑instance compression without the overhead of
    maintaining multiple specialized models.
  realising:
    title: 'FlexComp: One Model for Every Ratio in Context Compression'
    arxiv: '2609.11192'
    published: '2026-09-10'
  prior_work:
  - title: Adapting Language Models to Compress Contexts
    arxiv: '2305.14788'
    doi: 10.48550/arXiv.2305.14788
    published: '2023-05-24'
  - title: Autoencoding-Free Context Compression for LLMs via Contextual Semantic Anchors
    arxiv: '2510.08907'
    doi: 10.48550/arXiv.2510.08907
    published: '2025-10-10'
  - title: 'SnapKV: LLM Knows What You are Looking for Before Generation'
    arxiv: '2404.14469'
    doi: 10.48550/arXiv.2404.14469
    published: '2024-04-22'
  domain: cs
  verification: ''
  _audit:
    realising_abstract: 'Soft context compression condenses a context into a few memory tokens that a frozen LLM consumes
      in place of the raw text, but existing compressors fix the compression ratio at training and inference: each deployed
      ratio requires a separately trained model, and the chosen ratio is applied uniformly to all inputs, whose actual needs
      vary drastically. We propose FlexComp, a method-agnostic framework that decouples the ratio from both training and deployment:
      Matryoshka-style training samples the memory budget $K$ per instance, turning one model into an any-ratio compressor,
      and the budget is then chosen per input by: (1) confidence-based cascade routing or (2) a lightweight learned $K$ predictor.
      Across ICAE, 500xCompressor, and SAC on MRQA, a single FlexComp model matches separately trained fixed-ratio specialists
      with minimal degradation. Cascade routing preserves over 98% of the mildest ratio''s accuracy at up to 266x average
      compression; the $K$ predictor, in a single compression-decoding pass, reaches 158-236x within 0.7 F1 of the mildest
      ratio. At serving-scale batch sizes, the $K$ predictor cuts context KV cache by 50% and improves decoding throughput
      by 47%.'
    references_total: 23
    references_earlier_with_abstract: 15
