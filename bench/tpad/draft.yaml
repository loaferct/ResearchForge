- id: T-2609.11414
  idea: We aim to improve the assignment of individual dialogue turns to the most appropriate large language model in a multi‑turn
    conversation. The central difficulty is how to construct a prompt that preserves useful history while avoiding the mixing
    of irrelevant information, which directly influences the selection quality. Our plan is to develop a context‑segmentation
    technique that groups recent utterances into overlapping windows based on semantic similarity, then contracts each window
    to retain only the most representative content. In parallel, we will introduce a two‑stage evaluation framework that separately
    measures the fidelity of the constructed prompt and the effectiveness of the model‑selection decision, preventing the
    two factors from confounding one another. This joint design is intended to enable more reliable multi‑turn model selection.
  realising:
    title: 'SWRouter: Similarity-Contractive Window Routing for Multi-Turn Large Language Model Conversations'
    arxiv: '2609.11414'
    published: '2026-09-10'
  prior_work:
  - title: Large Language Model Routing with Benchmark Datasets
    arxiv: '2309.15789'
    doi: 10.48550/arXiv.2309.15789
    published: '2023-09-27'
  - title: 'CMMLU: Measuring massive multitask language understanding in Chinese'
    arxiv: '2306.09212'
    doi: 10.48550/arXiv.2306.09212
    published: '2023-06-15'
  - title: 'Direct Preference Optimization: Your Language Model is Secretly a Reward Model'
    arxiv: '2305.18290'
    doi: 10.52202/075280-2338
    published: '2023-05-29'
  domain: cs
  verification: ''
  _audit:
    realising_abstract: 'Large language models exhibit complementary strengths, motivating routing methods that dispatch each
      query to the most suitable model. Although existing routers are effective in single-turn settings, they do not directly
      transfer to multi-turn dialogue, where routing performance critically depends on how historical context is segmented,
      retained, and incorporated into the current prompt. This introduces two fundamental challenges: preventing information
      loss and information confusion during context construction, and evaluating routing quality without conflating model
      selection with prompt construction quality. In this paper, we propose SWRouter, a Similarity-Contractive Window Router
      for multi-turn large language model routing. SWRouter combines a similarity-based context segmentation mechanism for
      prompt construction with a dual-metric evaluation framework that decouples construction accuracy from router performance.
      Experiments on multi-turn dialogue benchmarks demonstrate that SWRouter consistently surpasses strong baselines, achieving
      a 16.26% improvement in evaluation accuracy over the best individual large language model and an additional 8.22% gain
      over the Conv-ID Context baseline. Our results highlight that multi-turn large language model routing requires a joint
      design of context construction and evaluation, rather than a direct extension of single-turn routing methods.'
