  _audit:
    realising_abstract: 'Muon has emerged as a highly effective optimizer for large language model training, often achieving
      superior convergence and performance compared with the widely adopted Adam and AdamW optimizers. Nevertheless, Muon
      is prone to training instability due to its spectral flattening, manifested by loss spikes and unbounded growth of model
      weights. Existing approaches primarily rely on weight or attention-logit clipping, which require architecture-specific
      modifications and do not directly address instability across all model components. We propose MomentUm SpEctral Clipping
      (Musec), which replaces Muon''s spectral flattening with spectral clipping: rather than setting all singular values
      of the momentum matrix to approximately one, Musec clips singular values that exceed a threshold while preserving the
      underlying spectral structure of the momentum. Our strategy provides an optimizer-level, architecture-agnostic mechanism
      for stabilizing Muon training. Theoretically, we establish convergence guarantees for Musec in nonconvex nonsmooth stochastic
      optimization. Practically, we develop Soft Musec, an efficient implementation that uses a smooth spectral saturation
      function approximated by coupled Newton-Schulz iterations. Empirically, Soft Musec consistently improves training stability
      over existing Muon variants across a wide range of learning rates and model sizes, remaining stable in settings where
      existing Muon variants diverge while matching their performance under well-tuned configurations.'
