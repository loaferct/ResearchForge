  _audit:
    realising_abstract: 'In team collaboration scenarios, memory is heterogeneous and continually evolving. Team memories
      capture collective decisions, protocols, and current consensus, while individual memories preserve member-specific observations,
      execution traces, and intermediate progress. Existing memory-augmented systems typically retrieve from all stored memories
      as a flat pool, ranking them by semantic relevance, importance, or recency without modeling hierarchical structure or
