- id: T-2609.11655
  idea: 'Training large language models with a recent momentum‑based optimizer often yields rapid convergence but suffers
    from instability: the momentum matrix is forced toward a flat spectrum, which can cause sudden loss spikes and uncontrolled
    growth of parameters. Existing remedies focus on clipping weights or attention logits and require changes to specific
    model components, leaving the underlying instability unaddressed. We propose to stabilize this optimizer by modifying
    its momentum update so that singular values exceeding a chosen bound are truncated, while the overall spectral shape is
    retained. This spectral‑value clipping will be applied at the optimizer level, making it independent of model architecture.
    We will develop a smooth approximation of the clipping operation using iterative matrix‑square‑root techniques, and we
    will analyze convergence in non‑convex stochastic settings.'
