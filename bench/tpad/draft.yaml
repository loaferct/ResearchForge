- id: T-2609.12230
  idea: 'Multi‑hop question answering often relies on reasoning over a chain of facts in a knowledge graph, yet current language‑model
    training typically uses isolated head‑relation‑tail triples, depriving the model of the surrounding context that supports
    multi‑step inference. We propose to enrich each target triple (or path) with additional triples drawn from the same source
    passage, forming a local context subgraph that is presented together with the primary supervision signal. The model will
    be fine‑tuned under two regimes: one using only the target triple/path and another that also incorporates the supporting
    context. To improve the reliability of the base facts, we will introduce an adaptive repair loop that detects one‑hop
    failures, generates corrective examples, and iteratively refines the model. After this cleaning stage, we will apply reinforcement‑learning‑based
    optimization on lower‑hop QA instances and evaluate transfer to deeper multi‑hop queries.'
  realising:
    title: 'Repair Before Reinforce: Context-Augmented Knowledge Graph Reasoning for Multi-Hop Question Answering'
    arxiv: '2609.12230'
    published: '2026-09-10'
  prior_work: []
  domain: cs
  verification: ''
  _audit:
    realising_abstract: 'Question-answering often requires reasoning across multiple connected facts rather than retrieving
      a single isolated relation. Knowledge graphs (KGs) provide a structured way to represent such facts, but training large
      language models (LLMs) only on isolated KG head-relation-tail triples may limit their ability to learn the surrounding
      context needed for multi-hop reasoning. In this work, we propose a context-augmented training framework for multi-hop
      question-answering. Although generally applicable, we validate the framework in the context of disease-specific KGs,
      extracted using a reliable KG extraction framework called GraphMERT, for Gastroparesis and Diabetes. For each primary
      KG triple, we attach supporting triples extracted from the same source text chunk to form a context graph (CG). This
      creates two supervision settings: KG-grounded supervision, which uses only the target KG triple or path, and CG-grounded
      supervision, which uses the target KG triple or path together with supporting context triples. We train the Qwen3-14B
      model using supervised fine-tuning (SFT) under both settings, producing KGModel and CGModel variants. To strengthen
      the lower-hop factual foundation of the models, we introduce an LLM-judged, history-aware adaptive repair pipeline that
      identifies unresolved one-hop failures, continually fine-tunes on targeted repair examples, and removes or quarantines
      problematic noisy triples. This repair stage enables the models to reach 100% accuracy on the cleaned retained one-hop
      validation sets. Finally, we employ reinforcement learning (RL) using lower-hop question-answer items and evaluate generalization
      on harder 3-hop, 4-hop, and 5-hop tasks. Across both diseases, context-augmented supervision consistently improves multi-hop
      performance over KG-only supervision. RL initialized from repaired SFT checkpoints yields larger and more stable gains.'
