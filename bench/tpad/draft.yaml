- id: T-2609.09835
  idea: We aim to enable interactive personalization of large language models without modifying their parameters. The central
    problem is that a user’s preferences are hidden and only gradually revealed through successive exchanges, making it difficult
    to balance enduring tastes with moment‑to‑moment intents. Our approach is to keep a set of interpretable, natural‑language
    hypotheses that capture both short‑term goals and long‑term inclinations. After each turn, we will employ a surrogate
    choice model built from the same language model to evaluate how well each hypothesis explains the observed user response,
    and then re‑weight the hypothesis set using a sequential Monte‑Carlo–style update. By iterating this process across dialogue
    turns and sessions, we expect to maintain a dynamic, query‑aware profile that guides the model’s outputs toward the user’s
    evolving preferences.
