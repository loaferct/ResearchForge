- id: T-2609.11061
  idea: 'The challenge is to obtain reliable step‑level credit in tree‑structured rollouts for reinforcement learning without
    a learned critic. Existing strategies place branch points at fixed intervals or by measuring token‑level uncertainty,
    but the utility of a branch depends heavily on whether the underlying value trajectory is actually turning at that location.
    We propose to identify “pivot” positions by monitoring how the model’s internal estimate of the final answer evolves along
    a rollout and to insert a fork immediately before the point of greatest divergence between successive belief estimates.
    The belief signal can be extracted in three ways: a lightweight black‑box probe of the model’s output distribution, a
    depth‑wise inspection of logits, or a direction in activation space learned offline. By using this signal solely to decide
    fork locations, we aim to allocate the limited sampling budget to the most informative steps, improving credit assignment
    while incurring minimal extra computation.'
  realising:
    title: 'Fork Where the Model Changes Its Mind: Belief-Shift Branching for Tree-Structured Reinforcement Learning'
    arxiv: '2609.11061'
    published: '2026-09-10'
  prior_work:
  - title: 'ReST-MCTS*: LLM Self-Training via Process Reward Guided Tree Search'
    arxiv: '2406.03816'
    doi: 10.48550/arXiv.2406.03816
    published: '2024-06-06'
  - title: 'Rewarding Progress: Scaling Automated Process Verifiers for LLM Reasoning'
    arxiv: '2410.08146'
    doi: 10.48550/arXiv.2410.08146
    published: '2024-10-10'
  - title: 'TreeRL: LLM Reinforcement Learning with On-Policy Tree Search'
    arxiv: '2506.11902'
    doi: 10.48550/arXiv.2506.11902
    published: '2025-06-13'
  domain: cs
  verification: ''
  _audit:
    realising_abstract: 'Tree-structured rollouts give critic-free reinforcement learning with verifiable rewards (RLVR) step-level
      credit: fork a chain at an intermediate point, and sibling outcome differences estimate step value. Each fork adds sampling
      cost, so realistic budgets typically allow only a few forks per chain. A fork placed where the outcome is already largely
      settled yields siblings that mostly agree and provide almost no credit signal; hence, for a given tree size, where forks
      are placed largely determines how much step-level RL can gain. Most existing mainstream methods place forks by structure,
      such as fixed lengths, midpoints, and delimiters, or by next-token entropy. We formalize fork placement as locating
      the \emph{pivots} of the chain''s value curve, where the expected outcome turns. We propose \emph{belief-shift branching}:
      read the model''s answer belief at candidate boundaries and fork just before the step where consecutive beliefs diverge
      most. Three instantiations, none needing step-level supervision, span access levels: a black-box probe, a logit-lens
      depth profile, and a learned activation direction, which is fit offline and therefore used only in the validation before
      RL training. The signal only \emph{places} forks, and the probe costs about $1\%$ of step compute on mathematics and
      under $5\%$ on code when it runs inside the rollout engine. In that validation, against Monte-Carlo value curves, a
      belief-shift signal ranks first in each of the eight model$\times$benchmark panels, ahead of entropy, structural, and
      LLM-judge baselines. In RL across three model families and two domains, belief-shift forking leads every mathematics
      aggregate, on OLMo-3-7B by $+2.6$ aggregate and $+2.9$ on AIME 2026 over the strongest baseline, and sweeps every OLMo
      code column, by $+6.5$ on LiveCodeBench-medium.'
    references_total: 71
    references_earlier_with_abstract: 42
