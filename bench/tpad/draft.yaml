- id: T-2609.09953
  idea: Multilingual sentence encoders are typically trained to align whole sentences, yet they are increasingly deployed
    for word‑ or span‑level tasks such as hallucination detection and sequence labeling, creating a gap between training objectives
    and downstream use. We propose a lightweight post‑training step that injects supervision at the span level into an already
    trained sentence encoder. By exposing the model to annotated text spans, the approach aims to refine the internal token
    embeddings while preserving the encoder’s ability to produce high‑quality sentence vectors. The plan includes evaluating
    the modified model on a suite of multilingual token‑level benchmarks as well as on standard sentence‑level retrieval and
    classification tasks to assess whether span‑level signals can jointly enhance both granular and holistic representations.
