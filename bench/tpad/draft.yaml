- id: T-2609.09707
  idea: Mathematical fine‑tuning currently applies the same cross‑entropy penalty to every target token, which can over‑fit
    tokens the model already predicts confidently while over‑loading tokens it barely distinguishes. We propose to modulate
    the supervision signal by measuring, for each token, the confidence gap between the correct symbol and the strongest competing
    prediction. Tokens with very large gaps (already mastered) and those with very small or negative gaps (still ambiguous)
    would receive reduced weight, while tokens whose gap lies in an intermediate range would be emphasized. A smooth weighting
    function (e.g., a Gaussian centered on a chosen margin with adjustable bandwidth) can implement this without extra forward
    passes or reference models. The plan is to test this re‑weighting on several large language models across standard mathematical
    reasoning benchmarks and assess whether it yields more balanced confidence and improved performance.
