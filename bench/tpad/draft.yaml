- id: T-2609.07286
  idea: We aim to address the tendency of multimodal audio‑text systems to generate affirmative answers about sound events
    that are not present in the input, a failure that compromises trustworthiness in audio question answering. The proposed
    plan is to introduce a training‑free decoding modification that, at the moment the model first decides between “yes” and
    “no”, compares the model’s output distribution on the actual audio with that obtained from a silent reference of identical
    length. By measuring the confidence gap between these two distributions, we will apply an adaptive gate that suppresses
    spurious affirmative tokens when the audio evidence is insufficient, while allowing them when the evidence is strong.
    This contrastive, confidence‑driven mechanism is intended to reduce false positive predictions without altering the underlying
    model parameters.
