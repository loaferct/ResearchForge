- id: T-2609.08650
  idea: We aim to improve the breadth of correct solutions discovered by large reasoning models trained with reward‑based
    reinforcement learning. Although such training raises per‑example accuracy, it often leaves the model’s overall solution
    coverage stagnant because the exploration strategy during rollouts is limited. We propose to redesign the rollout process
    by (1) adjusting the difficulty of generated sub‑problems according to the model’s current competence, (2) organizing
    the exploration as a hierarchical search tree rather than as independent parallel attempts, and (3) steering the branching
    decisions with a measure of sentence‑level entropy to promote semantically diverse continuations. An auxiliary term that
    rewards diversity among sibling branches will be added to the training objective. The plan is to test this approach on
