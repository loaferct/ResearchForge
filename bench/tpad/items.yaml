- id: T-2609.09156
  idea: The growing volume of scholarly literature makes it increasingly difficult for authors to locate sources that directly
    substantiate specific statements, and existing retrieval‑augmented generators tend to select papers based on surface similarity
    rather than logical relevance. We propose to develop a modular framework that treats each citation decision as an active
    reasoning problem. The system will first detect the location and intent of a claim, then formulate a purpose‑driven search
    query, retrieve candidate papers, and finally run a reflective verification step that assesses whether the retrieved evidence
    actually supports the claim. If the check fails, the loop will trigger a revised query or alternative source selection.
    Training will use synthetically generated reasoning trajectories to teach the model to align claims with appropriate references.
