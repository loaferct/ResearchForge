- id: T-2609.11061
  idea: 'The challenge is to obtain reliable step‑level credit in tree‑structured rollouts for reinforcement learning without
    a learned critic. Existing strategies place branch points at fixed intervals or by measuring token‑level uncertainty,
    but the utility of a branch depends heavily on whether the underlying value trajectory is actually turning at that location.
    We propose to identify “pivot” positions by monitoring how the model’s internal estimate of the final answer evolves along
    a rollout and to insert a fork immediately before the point of greatest divergence between successive belief estimates.
    The belief signal can be extracted in three ways: a lightweight black‑box probe of the model’s output distribution, a
    depth‑wise inspection of logits, or a direction in activation space learned offline. By using this signal solely to decide
    fork locations, we aim to allocate the limited sampling budget to the most informative steps, improving credit assignment
    while incurring minimal extra computation.'
