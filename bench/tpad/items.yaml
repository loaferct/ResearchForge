- id: T-2609.10060
  idea: The prevailing audits of social bias in large language models depend on the models’ generated text, which requires
    costly benchmark datasets or external judges and can miss systematic changes that never surface in output. We propose
    to examine the internal token‑level representations themselves, comparing a model before and after a modification such
    as fine‑tuning. By fixing a small collection of exemplar sentences and encoding every input as its similarity profile
    to these exemplars, we obtain a shared comparison space that makes representations from different checkpoints comparable.
    In this space we will quantify how the association between demographic groups and positive versus negative attribute concepts
    shifts. The plan is to evaluate this shift across several model families and bias‑related test suites, assess its alignment
    with traditional output‑based measures, and verify robustness to the choice of exemplars, all while requiring far less
    computation than existing methods.
