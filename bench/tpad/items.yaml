- id: T-2609.09768
  idea: 'We aim to tackle the latency bottleneck that arises when a retrieval‑augmented generation system concatenates a large
    number of retrieved passages, inflating the input length and dramatically increasing the pre‑fill cost. Prior techniques
    that reuse pre‑computed attention states can cut the time to first token, yet it is unclear whether they preserve answer
    quality for extremely long contexts. We propose a two‑fold strategy: (i) fine‑tune the language model while explicitly
    exposing it to the pattern of concatenated attention memories, encouraging it to handle such inputs more robustly; and
    (ii) during inference, selectively recompute attention states for a chosen subset of the retrieved chunks while reusing
    the rest. This combined plan is intended to retain the speed benefits of cache reuse while improving generation fidelity
    for very long inputs.'
