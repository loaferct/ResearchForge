- id: T-2609.11572
  idea: 'The reliability of open‑domain question answering drops sharply when source texts are continuously amended, as in
    statutes, policies, or regulations. In such settings each new amendment supersedes earlier clauses while retaining much
    of the original wording, creating a dense semantic overlap across successive versions. Existing time‑aware retrieval techniques
    treat each version as an isolated snapshot and therefore cannot distinguish which revision best matches a time‑specific
    query. We propose to develop a retrieval‑agnostic framework that enriches any standard document retriever with a temporal
    relevance component: the rank of a candidate passage will be adjusted according to the elapsed time between the query’s
    target date and the passage’s version timestamp, while still leveraging its semantic similarity to the query. To evaluate
    the approach, we will construct a benchmark comprising regulatory documents with overlapping revisions and time‑stamped
    queries, measuring how well the combined temporal‑semantic ranking improves answer accuracy.'
