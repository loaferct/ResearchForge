  idea: Large language models contain many sequential processing blocks, yet many tokens do not require the full depth during
    inference. Existing adaptive layer‑selection techniques decide locally, based only on the current token representation,
    ignoring that earlier routing choices influence later hidden states and the overall computational budget. We propose to
    endow the routing mechanism with a lightweight memory that accumulates a summary of past routing scores and the corresponding
    residual updates as the token traverses the network. At each block, the router will condition jointly on this accumulated
    history and the present hidden vector to determine whether to execute or skip the block. The backbone model remains frozen
    while only small adapters and the memory‑augmented routers are trained, enabling more coherent and efficient depth adaptation.
