- id: T-2609.10439
  idea: Large language models often retain and reproduce sensitive or copyrighted material, raising privacy and compliance
    risks. Retraining from scratch is costly, while existing unlearning techniques apply uniform parameter changes that can
    harm the model’s usefulness and may be undone by later deployment steps such as quantization. We propose to develop a
    selective‑layer unlearning strategy that first quantifies, for each transformer layer, how strongly it contributes to
    reproducing the undesired content versus preserving the desired knowledge. By focusing weight updates on layers with high
    influence on the forget set and low impact on the retain set, we aim to erase targeted information with minimal disturbance
    to the rest of the network. The plan includes designing the significance metric, implementing layer‑focused fine‑tuning,
    and evaluating robustness to post‑training quantization and adversarial prompts.
