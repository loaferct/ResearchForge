  idea: Long‑term interactive agents accumulate large amounts of episodic information, which soon makes storage and real‑time
    lookup prohibitively expensive. We propose a memory‑management framework that first groups past experiences into coherent
    segments by exploiting global semantic similarity together with local temporal continuity. Within each segment we construct
