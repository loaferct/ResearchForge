- id: T-2609.11446
  idea: We aim to improve collaborative inference among a set of diverse models by establishing a unified reliability metric
    for their confidence scores. The plan is to first apply a model‑specific calibration step, using held‑out validation data,
    so that each model’s output probabilities reflect true likelihoods. Once calibrated, we will define common thresholds
    that determine whether a prediction can be accepted immediately, whether a more powerful model should be consulted, or
    whether multiple model outputs should be combined. By basing decisions on calibrated confidence, the routing policy becomes
    independent of the particular models or computational budget in use. We will also develop a theoretical link between calibration
    and the expected selective risk, and evaluate the approach on language and vision benchmarks.
