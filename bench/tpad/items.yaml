- id: T-2609.09883
  idea: We aim to lower the inference cost of large language models by eliminating whole transformer layers while preserving
    performance. Existing techniques that decide which layers to drop rely on collecting activations from calibration data,
    which incurs additional computation. Our proposal is to infer redundancy between layers directly from the saved weight
    matrices, eliminating the need for any forward passes. Specifically, we will compare the attention‑output projection matrices
    and the down‑projection matrices of the feed‑forward networks across all layers, incorporate relative scaling factors,
    and construct a pairwise similarity matrix. This matrix will be used to group similar layers and select a subset to retain,
    thereby achieving layer reduction based solely on weight‑based similarity.
