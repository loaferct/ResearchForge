# ResearchForge settings. Copy to researchforge.toml and edit.
# Environment overrides: RF_PROVIDER, RF_MODEL, RF_REASONING_EFFORT, RF_PROJECTS_DIR,
# RF_DSH_HOME, RF_DSH_VERSION, RF_DSH_COMMAND, RF_CONTACT_EMAIL, RF_LOG_LEVEL.
# Credentials are never stored here, only the names of environment variables.

projects_dir = "./research_projects"
log_level = "INFO"

[model]
# Default: DeepSeek's API through dsh's deepseek-official route (reads $DEEPSEEK_API_KEY).
provider = "deepseek-official"
model = "deepseek-flash"
# reasoning_effort = "high"

# Self-hosted open-weight model through an OpenAI-compatible server
# (vLLM, SGLang, Ollama, llama.cpp). When this table is present it is used
# instead of `provider`, and `model` must be one of `models`.
# [model.custom]
# provider_id = "local-vllm"
# base_url = "http://127.0.0.1:8000/v1"
# api = "openai-completions"
# api_key_env = "LOCAL_LLM_API_KEY"
# models = ["Qwen/Qwen3-32B"]
# context_window = 131072

# Ollama Cloud (hosted open-weight models, OpenAI-compatible). Key in $OLLAMA_API_KEY.
# Model ids: GET https://ollama.com/v1/models. DeepSeek models need credits or a paid plan;
# gpt-oss:120b is in the free usage.
# [model]
# model = "deepseek-v4.1-flash"
# [model.custom]
# provider_id = "ollama-cloud"
# base_url = "https://ollama.com/v1"
# api = "openai-completions"
# api_key_env = "OLLAMA_API_KEY"
# models = ["deepseek-v4.1-flash", "deepseek-v4-pro:0813", "gpt-oss:120b"]

[dsh]
# argv prefix for dsh. Default: `dsh` if on PATH, else `npx -y @deepseek-ai/dsh@<version>`.
# command = ["dsh"]
version = "0.1.7-rc.2"
home = "~/.researchforge/dsh-home"   # isolated DSH_HOME for investigation sessions
profile = "headless"
phase_timeout_s = 1800
# Additional Cordis patch overlays applied after ResearchForge's own.
extra_patches = []
disable_telemetry = true
# dsh rows disabled for the research agent (least privilege).
disable_tools = ["tool-bash", "tool-pwsh", "tool-fs", "tool-web", "tool-jobs", "tool-subagent", "tool-subagent-fork", "tool-workflow"]

[literature]
sources = ["arxiv", "openalex", "semantic_scholar", "crossref"]
max_results_per_source = 10
timeout_s = 30
max_retries = 4
max_backoff_s = 40
# contact_email = "you@example.org"      # OpenAlex/Crossref polite pool
semantic_scholar_api_key_env = "SEMANTIC_SCHOLAR_API_KEY"
openalex_api_key_env = "OPENALEX_API_KEY"
github_token_env = "GITHUB_TOKEN"
max_pdf_bytes = 40000000
integrity_checks = true                  # flag mismatched abstracts (docs/AGENT_LOOP.md, Source integrity)
# Evaluation controls for the temporal prior-art benchmark (docs/paper/research_plan.md). Leave unset normally.
# published_before = 2026-03-01          # hide work published on or after this date; disables GitHub tools
# corrupt_abstracts = 0.1                # swap this share of retrieved abstracts (robustness study only)
# corruption_seed = 0

[investigation]
min_papers = 8
min_queries = 2
papers_to_analyze = 8
max_phase_attempts = 2
min_modifications = 2
max_modifications = 5
# Investigation loop: safety limits, not the normal stopping condition (docs/AGENT_LOOP.md)
max_iterations = 40
max_tool_calls = 600
max_searches = 30
max_papers = 150
time_limit_s = 14400
max_critiques = 3
recritique_after_papers = 6
max_uncertainty_attempts = 2
max_action_retries = 2
runtime_retries = 2
runtime_retry_backoff_s = 5.0
# Ablation switches (docs/paper/research_plan.md §5.1)
challenge_conclusions = true
recritique_on_contradiction = true
controller_mode = "adaptive"             # or "pipeline": fixed sequence, no uncertainty-driven investigation
pipeline_extra_searches = 0              # pipeline only: extra search/read rounds (compute-matched baseline)

[experiments]
backend = "local"            # or "docker"
docker_image = "python:3.12-slim"
docker_network = "none"
timeout_s = 3600
env_passthrough = ["PATH", "HOME", "LANG", "CUDA_VISIBLE_DEVICES"]
large_improvement_threshold = 0.5
