name: kv-cache
idea: >-
  Can request-aware dynamic KV-cache management reduce LLM inference memory and
  latency without significantly degrading accuracy?
notes: >-
  Curated set of work that an investigation of this idea should retrieve. Every
  entry was checked against OpenAlex (arXiv DOI 10.48550/arXiv.<id>) on
  2026-09-28; titles are as indexed there. The set is not exhaustive, so recall
  measured against it is an upper bound on true recall and precision a lower
  bound: relevant papers outside the set count as misses.
relevant:
  - arxiv: "2306.14048"
    title: "H$_2$O: Heavy-Hitter Oracle for Efficient Generative Inference of Large Language Models"
    role: attention-score-based KV eviction
  - arxiv: "2309.17453"
    title: "Efficient Streaming Language Models with Attention Sinks"
    role: attention sinks + recent window (StreamingLLM)
  - arxiv: "2404.14469"
    title: "SnapKV: LLM Knows What You are Looking for Before Generation"
    role: prompt-observation-window KV selection
  - arxiv: "2305.17118"
    title: "Scissorhands: Exploiting the Persistence of Importance Hypothesis for LLM KV Cache Compression at Test Time"
    role: importance-persistence eviction
  - arxiv: "2310.01801"
    title: "Model Tells You What to Discard: Adaptive KV Cache Compression for LLMs"
    role: per-head adaptive compression (FastGen)
  - arxiv: "2406.02069"
    title: "PyramidKV: Dynamic KV Cache Compression based on Pyramidal Information Funneling"
    role: layer-wise dynamic budgets
  - arxiv: "2309.06180"
    title: "Efficient Memory Management for Large Language Model Serving with PagedAttention"
    role: serving-system KV memory management (vLLM)
  - arxiv: "2406.10774"
    title: "Quest: Query-Aware Sparsity for Efficient Long-Context LLM Inference"
    role: query-aware KV page selection
  - arxiv: "2401.06104"
    title: "Transformers are Multi-State RNNs"
    role: bounded-state eviction policy (TOVA)
  - arxiv: "2402.18096"
    title: "No Token Left Behind: Reliable KV Cache Compression via Importance-Aware Mixed Precision Quantization"
    role: eviction vs mixed-precision retention
  - arxiv: "2403.09054"
    title: "Keyformer: KV Cache Reduction through Key Tokens Selection for Efficient Generative Inference"
    role: key-token selection
