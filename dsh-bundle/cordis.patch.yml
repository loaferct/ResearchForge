# ResearchForge bundle for DeepSeek Harness.
#
# Mounts the ResearchForge MCP server through dsh's in-box MCP client so any
# dsh surface (web, headless, sdk) gets the research tools as
# mcp__researchforge__*. The Python package must be installed:
#   pip install researchforge        (or: pip install -e /path/to/researchforge)
#
# Environment (all optional):
#   RESEARCHFORGE_PYTHON        Python interpreter that has researchforge installed (default: python3)
#   RESEARCHFORGE_PROJECT_DIR   investigation workspace (default: <cwd>/.researchforge/interactive)
#   RESEARCHFORGE_CONFIG        ResearchForge settings TOML
#
# The `researchforge investigate` CLI does not need this bundle; it generates an
# equivalent overlay per project (plus least-privilege tool restrictions).

- insert:
    - id: mcp-researchforge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: researchforge
        transport: stdio
        command: !!js process.env.RESEARCHFORGE_PYTHON ?? 'python3'
        args: ['-m', 'researchforge.mcp_server']
        cwd: !!js process.cwd()
        toolCallTimeoutMs: 300000
        env:
          RESEARCHFORGE_PROJECT_DIR: !!js process.env.RESEARCHFORGE_PROJECT_DIR ?? (process.cwd() + '/.researchforge/interactive')
          RESEARCHFORGE_CONFIG: !!js process.env.RESEARCHFORGE_CONFIG ?? ''
          RESEARCHFORGE_CREATE: '1'
          PYTHONUNBUFFERED: '1'
          # dsh scrubs *KEY*/*TOKEN* variables from MCP children; forward the optional literature credentials explicitly.
          SEMANTIC_SCHOLAR_API_KEY: !!js process.env.SEMANTIC_SCHOLAR_API_KEY ?? ''
          OPENALEX_API_KEY: !!js process.env.OPENALEX_API_KEY ?? ''
          GITHUB_TOKEN: !!js process.env.GITHUB_TOKEN ?? ''
